apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-deployment
  namespace: student-crud-app 

spec:
  
  replicas: 1

  selector:
    matchLabels:
      app: student

  template:
    metadata:
      labels:
        app: student
  
    spec:
      containers:
        - name: student-container
          image: vivek3230/student-crud:recent
          ports:
            - containerPort: 8000